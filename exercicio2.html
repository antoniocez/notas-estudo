<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício Avaliativo 2</title>
</head>
<body>
    <link rel="stylesheet" href="./exercicio2.css">
    <main>
        <section>
            <h1><img src="https://th.bing.com/th/id/OIP.nKAm5FDTAY_8Z0q2s8NiXQHaHa?w=176&h=180&c=7&r=0&o=7&cb=ucfimg2&pid=1.7&rm=3&ucfimg=1" alt="" width="35" height="35">Cadastre e concorra!</h1>
            <br>
            <p>Preencha o formulário e concorra a uma viagem dos sonhos para você mais um acompanhante para o local de sua escolha!</p>

            <div>
                <br>
                <form action="">
                    <div>
                        <label for="">Nome</label>
                        <input type="nome" placeholder="Digite seu nome">
                        <br><br>
                        <label for="">E-mail</label>
                        <input type="email" placeholder="Digite seu e-mail">
                        <br><br>
                        <label for="">Data de Nascimento</label>
                        <input type="date" placeholder="mm/dd/yyyy">
                        <br><br>
                        <label for="number">CPF</label>
                        <input type="number" placeholder="Digite seu CPF">
                        <br><br>
                        <b>
                        <div class="input-group">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" name="nome">
                        </div>
                        <div class="input-group">
                        <label for="sobrenome">Sobrenome:</label>
                        <input type="text" id="sobrenome" name="sobrenome">
                        </div>
                        <br><br>
                        <input type="text" placeholder="Digite sua cidade">
                        <input type="text" placeholder="Digite seu bairro">
                        <br><br>
                        <input type="text" placeholder="Digite sua Rua">
                        <input type="text" placeholder="Digite o complemento (ex: Apto 102)">
                        <br><br>
                        </b>
                        <br>
                        <button>CADASTRAR</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
